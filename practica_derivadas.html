<script>
    const questions = [
        // Base de datos - Lote 5 (Parte 1): 20 Ejercicios (Unidad III - Derivadas y Aplicaciones)
    
        // --- DERIVADAS POR DEFINICIÓN ---
        {
            topic: "Derivada por Definición (Límite)",
            text: "Usando la definición formal de derivada \\( f'(x) = \\lim_{h \\to 0} \\frac{f(x+h) - f(x)}{h} \\), halla el valor exacto de \\( f'(2) \\) para la función \\( f(x) = x^2 - 3x \\).",
            answers: ["1"],
            hints: [
                "Pista 1: Plantea el límite: \\( \\lim_{h \\to 0} \\frac{[(2+h)^2 - 3(2+h)] - [2^2 - 3(2)]}{h} \\).",
                "Pista 2: Desarrolla el binomio al cuadrado y multiplica: \\( (4 + 4h + h^2 - 6 - 3h) - (-2) \\).",
                "Pista 3: Simplifica el numerador, saca factor común \\( h \\), cancela con el denominador y evalúa cuando \\( h \\to 0 \\)."
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Planteamos la definición en \\( x = 2 \\):<br>\\[ f'(2) = \\lim_{h \\to 0} \\frac{f(2+h) - f(2)}{h} \\]<br>2. Evaluamos \\( f(2) = 2^2 - 3(2) = 4 - 6 = -2 \\).<br>3. Sustituimos en el límite:<br>\\[ \\lim_{h \\to 0} \\frac{(2+h)^2 - 3(2+h) - (-2)}{h} \\]<br>\\[ \\lim_{h \\to 0} \\frac{4 + 4h + h^2 - 6 - 3h + 2}{h} \\]<br>4. Simplificamos agrupando términos semejantes (los números se anulan: 4 - 6 + 2 = 0):<br>\\[ \\lim_{h \\to 0} \\frac{h^2 + h}{h} \\]<br>5. Factorizamos \\( h \\) y cancelamos:<br>\\[ \\lim_{h \\to 0} (h + 1) = 0 + 1 = 1 \\]"
        },
        {
            topic: "Derivada por Definición (Raíces)",
            text: "Dada la función \\( f(x) = \\sqrt{x} \\). Usa la definición formal (con límites) para calcular \\( f'(4) \\). <br><small><em>(Ingresa fracción simplificada o decimal)</em></small>",
            answers: ["1/4", "0.25"],
            hints: [
                "Pista 1: El límite es \\( \\lim_{h \\to 0} \\frac{\\sqrt{4+h} - 2}{h} \\).",
                "Pista 2: Para resolverlo, multiplica numerador y denominador por el conjugado: \\( \\sqrt{4+h} + 2 \\).",
                "Pista 3: En el numerador te quedará \\( (4+h) - 4 = h \\). Cancela la \\( h \\) y evalúa."
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Planteamos el límite:<br>\\[ f'(4) = \\lim_{h \\to 0} \\frac{\\sqrt{4+h} - \\sqrt{4}}{h} = \\lim_{h \\to 0} \\frac{\\sqrt{4+h} - 2}{h} \\]<br>2. Multiplicamos por el conjugado para romper la indeterminación 0/0:<br>\\[ \\lim_{h \\to 0} \\frac{(\\sqrt{4+h} - 2)(\\sqrt{4+h} + 2)}{h(\\sqrt{4+h} + 2)} \\]<br>3. Aplicamos diferencia de cuadrados en el numerador:<br>\\[ \\lim_{h \\to 0} \\frac{4 + h - 4}{h(\\sqrt{4+h} + 2)} = \\lim_{h \\to 0} \\frac{h}{h(\\sqrt{4+h} + 2)} \\]<br>4. Cancelamos \\( h \\) y evaluamos:<br>\\[ \\lim_{h \\to 0} \\frac{1}{\\sqrt{4+h} + 2} = \\frac{1}{\\sqrt{4} + 2} = \\frac{1}{2 + 2} = \\frac{1}{4} = 0.25 \\]"
        },
        
        // --- TEOREMAS DE DERIVACIÓN ---
        {
            topic: "Regla del Producto",
            text: "Halla el valor exacto de la derivada de \\( f(x) = x^2 \\ln(x) \\) evaluada en \\( x = e \\). (Es decir, \\( f'(e) \\)).",
            answers: ["3e"],
            hints: [
                "Pista 1: Usa la regla del producto: \\( (uv)' = u'v + uv' \\). Aquí \\( u = x^2 \\) y \\( v = \\ln(x) \\).",
                "Pista 2: \\( f'(x) = (2x)\\ln(x) + (x^2)(1/x) \\).",
                "Pista 3: Simplifica la expresión a \\( 2x\\ln(x) + x \\) y evalúa en \\( x = e \\). Recuerda que \\( \\ln(e) = 1 \\)."
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Aplicamos regla del producto:<br>\\[ f'(x) = \\frac{d}{dx}(x^2) \\cdot \\ln(x) + x^2 \\cdot \\frac{d}{dx}(\\ln(x)) \\]<br>\\[ f'(x) = 2x \\ln(x) + x^2 \\left(\\frac{1}{x}\\right) \\]<br>2. Simplificamos la función derivada:<br>\\[ f'(x) = 2x \\ln(x) + x \\]<br>3. Evaluamos en \\( x = e \\):<br>\\[ f'(e) = 2(e)\\ln(e) + e \\]<br>4. Sabemos que \\( \\ln(e) = 1 \\):<br>\\[ f'(e) = 2e(1) + e = 3e \\]"
        },
        {
            topic: "Regla del Cociente",
            text: "Dada la función racional \\( f(x) = \\frac{2x}{x + 1} \\), calcula el valor de \\( f'(1) \\). <br><small><em>(Ingresa fracción simplificada o decimal)</em></small>",
            answers: ["1/2", "0.5"],
            hints: [
                "Pista 1: Usa la regla del cociente: \\( \\frac{u'v - uv'}{v^2} \\).",
                "Pista 2: \\( u = 2x \\implies u' = 2 \\). \\( v = x+1 \\implies v' = 1 \\).",
                "Pista 3: Sustituye en la fórmula, simplifica el numerador y evalúa en \\( x=1 \\)."
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Aplicamos la regla del cociente:<br>\\[ f'(x) = \\frac{(2)(x + 1) - (2x)(1)}{(x + 1)^2} \\]<br>2. Desarrollamos y simplificamos el numerador:<br>\\[ f'(x) = \\frac{2x + 2 - 2x}{(x + 1)^2} = \\frac{2}{(x + 1)^2} \\]<br>3. Evaluamos en \\( x = 1 \\):<br>\\[ f'(1) = \\frac{2}{(1 + 1)^2} = \\frac{2}{2^2} = \\frac{2}{4} = \\frac{1}{2} = 0.5 \\]"
        },
        
        // --- FUNCIONES TRIGONOMÉTRICAS E INVERSAS ---
        {
            topic: "Derivada de Funciones Trigonométricas",
            text: "Encuentra el valor exacto de \\( f'(\\pi/4) \\) para la función \\( f(x) = \\tan(x) - x \\).",
            answers: ["1"],
            hints: [
                "Pista 1: La derivada de \\( \\tan(x) \\) es \\( \\sec^2(x) \\). La derivada de \\( x \\) es 1.",
                "Pista 2: La derivada es \\( f'(x) = \\sec^2(x) - 1 \\).",
                "Pista 3: Evalúa en \\( \\pi/4 \\) (45 grados). Recuerda que \\( \\cos(\\pi/4) = 1/\\sqrt{2} \\), por lo tanto \\( \\sec(\\pi/4) = \\sqrt{2} \\)."
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Derivamos la función término a término:<br>\\[ f'(x) = \\sec^2(x) - 1 \\]<br>*(Nota: por identidad trigonométrica esto es igual a \\( \\tan^2(x) \\), puedes usar cualquiera de las dos).*<br>2. Evaluamos en \\( x = \\pi/4 \\):<br>\\[ f'(\\pi/4) = \\sec^2(\\pi/4) - 1 \\]<br>3. Sabemos que \\( \\cos(\\pi/4) = \\frac{1}{\\sqrt{2}} \\), entonces \\( \\sec(\\pi/4) = \\sqrt{2} \\):<br>\\[ f'(\\pi/4) = (\\sqrt{2})^2 - 1 = 2 - 1 = 1 \\]"
        },
        {
            topic: "Derivadas de Trigonométricas Inversas",
            text: "Calcula el valor exacto de \\( f'(0) \\) para la función \\( f(x) = \\arcsin(2x) \\).",
            answers: ["2"],
            hints: [
                "Pista 1: La derivada general de \\( \\arcsin(u) \\) es \\( \\frac{u'}{\\sqrt{1 - u^2}} \\).",
                "Pista 2: Aquí \\( u = 2x \\), por lo que \\( u' = 2 \\).",
                "Pista 3: Sustituye \\( x = 0 \\) en la derivada obtenida."
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Usamos la regla de la cadena para la función arcoseno:<br>\\[ f'(x) = \\frac{1}{\\sqrt{1 - (2x)^2}} \\cdot \\frac{d}{dx}(2x) \\]<br>\\[ f'(x) = \\frac{2}{\\sqrt{1 - 4x^2}} \\]<br>2. Evaluamos la derivada en \\( x = 0 \\):<br>\\[ f'(0) = \\frac{2}{\\sqrt{1 - 4(0)^2}} \\]<br>\\[ f'(0) = \\frac{2}{\\sqrt{1 - 0}} = \\frac{2}{1} = 2 \\]"
        },

        // --- REGLA DE LA CADENA ---
        {
            topic: "Regla de la Cadena (Potencias)",
            text: "Dada la función \\( f(x) = (3x^2 - x + 1)^2 \\), calcula \\( f'(1) \\).",
            answers: ["50"],
            hints: [
                "Pista 1: Usa la regla generalizada de la potencia: \\( \\frac{d}{dx}[u^n] = n \\cdot u^{n-1} \\cdot u' \\).",
                "Pista 2: \\( f'(x) = 2(3x^2 - x + 1)^1 \\cdot (6x - 1) \\).",
                "Pista 3: Sustituye \\( x = 1 \\) en ambos paréntesis y multiplica."
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Aplicamos la regla de la cadena bajando el exponente 2:<br>\\[ f'(x) = 2(3x^2 - x + 1)^{2-1} \\cdot \\frac{d}{dx}(3x^2 - x + 1) \\]<br>\\[ f'(x) = 2(3x^2 - x + 1)(6x - 1) \\]<br>2. Evaluamos directamente en \\( x = 1 \\):<br>\\[ f'(1) = 2(3(1)^2 - 1 + 1)(6(1) - 1) \\]<br>\\[ f'(1) = 2(3)(5) \\]<br>\\[ f'(1) = 30 \\]"
        },
        {
            topic: "Regla de la Cadena (Exponencial)",
            text: "Si \\( f(x) = e^{2x} \\), halla el valor exacto de \\( f'(\\ln 2) \\).",
            answers: ["8"],
            hints: [
                "Pista 1: La derivada de \\( e^u \\) es \\( e^u \\cdot u' \\).",
                "Pista 2: \\( f'(x) = 2e^{2x} \\).",
                "Pista 3: Evalúa en \\( \\ln 2 \\). Recuerda que \\( 2\\ln 2 = \\ln(2^2) = \\ln 4 \\), y que \\( e^{\\ln 4} = 4 \\)."
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Derivamos usando la regla de la cadena:<br>\\[ f'(x) = e^{2x} \\cdot \\frac{d}{dx}(2x) = 2e^{2x} \\]<br>2. Evaluamos en \\( x = \\ln(2) \\):<br>\\[ f'(\\ln 2) = 2e^{2\\ln 2} \\]<br>3. Aplicamos propiedad de logaritmos (subir el coeficiente como exponente):<br>\\[ 2e^{\\ln(2^2)} = 2e^{\\ln(4)} \\]<br>4. Propiedad inversa de exponencial y logaritmo (\\( e^{\\ln A} = A \\)):<br>\\[ f'(\\ln 2) = 2(4) = 8 \\]"
        },
        {
            topic: "Regla de la Cadena (Logarítmica)",
            text: "Encuentra \\( f'(2) \\) para la función \\( f(x) = \\ln(x^2 + 1) \\). <br><small><em>(Ingresa fracción simplificada o decimal)</em></small>",
            answers: ["4/5", "0.8"],
            hints: [
                "Pista 1: La derivada de \\( \\ln(u) \\) es \\( \\frac{u'}{u} \\).",
                "Pista 2: Deriva el argumento \\( x^2 + 1 \\) para el numerador.",
                "Pista 3: \\( f'(x) = \\frac{2x}{x^2 + 1} \\). Evalúa en \\( x = 2 \\)."
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Aplicamos la regla de derivación para logaritmos:<br>\\[ f'(x) = \\frac{1}{x^2 + 1} \\cdot \\frac{d}{dx}(x^2 + 1) \\]<br>\\[ f'(x) = \\frac{2x}{x^2 + 1} \\]<br>2. Evaluamos la derivada en \\( x = 2 \\):<br>\\[ f'(2) = \\frac{2(2)}{(2)^2 + 1} \\]<br>\\[ f'(2) = \\frac{4}{4 + 1} = \\frac{4}{5} = 0.8 \\]"
        },

        // --- DERIVACIÓN IMPLÍCITA ---
        {
            topic: "Derivación Implícita (Polinómica)",
            text: "Dada la ecuación de la curva \\( x^3 + y^3 = 9 \\). Encuentra el valor de la pendiente de la recta tangente (es decir, \\( dy/dx \\)) en el punto \\( (1, 2) \\). <br><small><em>(Ingresa fracción simplificada o decimal)</em></small>",
            answers: ["-1/4", "-0.25"],
            hints: [
                "Pista 1: Deriva ambos lados respecto a \\( x \\). La derivada de \\( y^3 \\) es \\( 3y^2 \\cdot y' \\).",
                "Pista 2: Te quedará \\( 3x^2 + 3y^2 y' = 0 \\).",
                "Pista 3: Despeja \\( y' \\) y sustituye \\( x=1 \\) e \\( y=2 \\)."
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Derivamos implícitamente respecto a \\( x \\):<br>\\[ \\frac{d}{dx}(x^3) + \\frac{d}{dx}(y^3) = \\frac{d}{dx}(9) \\]<br>\\[ 3x^2 + 3y^2 \\frac{dy}{dx} = 0 \\]<br>2. Despejamos \\( \\frac{dy}{dx} \\):<br>\\[ 3y^2 \\frac{dy}{dx} = -3x^2 \\implies \\frac{dy}{dx} = -\\frac{x^2}{y^2} \\]<br>3. Evaluamos en el punto \\( (1, 2) \\):<br>\\[ \\left. \\frac{dy}{dx} \\right|_{(1,2)} = -\\frac{1^2}{2^2} = -\\frac{1}{4} = -0.25 \\]"
        },
        {
            topic: "Derivación Implícita (Con Producto)",
            text: "Para la curva definida por \\( xy + y^2 = 6 \\), calcula el valor de \\( y' \\) en el punto \\( (1, 2) \\). <br><small><em>(Ingresa fracción simplificada o decimal)</em></small>",
            answers: ["-2/5", "-0.4"],
            hints: [
                "Pista 1: Aplica la regla del producto al término \\( xy \\). Su derivada es \\( (1)y + x(y') \\).",
                "Pista 2: La ecuación derivada es \\( y + xy' + 2yy' = 0 \\).",
                "Pista 3: Agrupa los términos con \\( y' \\), saca factor común y despeja. Luego sustituye \\( x=1, y=2 \\)."
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Derivamos implícitamente prestando atención a la regla del producto en \\( xy \\):<br>\\[ \\left(1 \\cdot y + x \\cdot \\frac{dy}{dx}\\right) + 2y \\frac{dy}{dx} = 0 \\]<br>2. Agrupamos los términos con la derivada:<br>\\[ x \\frac{dy}{dx} + 2y \\frac{dy}{dx} = -y \\]<br>3. Factorizamos \\( \\frac{dy}{dx} \\):<br>\\[ \\frac{dy}{dx}(x + 2y) = -y \\implies \\frac{dy}{dx} = \\frac{-y}{x + 2y} \\]<br>4. Evaluamos en \\( (1, 2) \\):<br>\\[ \\frac{dy}{dx} = \\frac{-2}{1 + 2(2)} = -\\frac{2}{5} = -0.4 \\]"
        },
        {
            topic: "Derivación Implícita (Trigonométrica)",
            text: "Calcula \\( y' \\) evaluada en \\( (1/2, \\pi/6) \\) para la curva \\( \\sin(y) = x \\). <br><small><em>(Ingresa tu respuesta usando 'sqrt' para raíz cuadrada. Ejemplo: 2/sqrt(3) o 2sqrt(3)/3 sin espacios)</em></small>",
            answers: ["2/sqrt(3)", "2sqrt(3)/3"],
            hints: [
                "Pista 1: Deriva ambos lados. La derivada de \\( \\sin(y) \\) es \\( \\cos(y) \\cdot y' \\).",
                "Pista 2: Obtienes \\( \\cos(y) \\cdot y' = 1 \\). Despejando: \\( y' = \\frac{1}{\\cos(y)} \\).",
                "Pista 3: Evalúa en el punto dado. Solo necesitas el valor de \\( y = \\pi/6 \\). Recuerda que \\( \\cos(\\pi/6) = \\sqrt{3}/2 \\)."
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Derivamos ambos lados respecto a \\( x \\):<br>\\[ \\cos(y) \\cdot \\frac{dy}{dx} = 1 \\]<br>2. Despejamos la derivada:<br>\\[ \\frac{dy}{dx} = \\frac{1}{\\cos(y)} = \\sec(y) \\]<br>3. Evaluamos para la coordenada \\( y = \\pi/6 \\) (30 grados):<br>\\[ \\left. \\frac{dy}{dx} \\right|_{y=\\pi/6} = \\frac{1}{\\cos(\\pi/6)} \\]<br>4. Sabiendo que \\( \\cos(\\pi/6) = \\frac{\\sqrt{3}}{2} \\):<br>\\[ \\frac{1}{\\frac{\\sqrt{3}}{2}} = \\frac{2}{\\sqrt{3}} = \\frac{2\\sqrt{3}}{3} \\]"
        },

        // --- DERIVADAS DE ORDEN SUPERIOR ---
        {
            topic: "Segunda Derivada (Polinomios)",
            text: "Dada la función \\( f(x) = x^4 - 2x^3 + 5x \\), halla el valor de su **segunda derivada** evaluada en 2, es decir, \\( f''(2) \\).",
            answers: ["24"],
            hints: [
                "Pista 1: Calcula la primera derivada \\( f'(x) = 4x^3 - 6x^2 + 5 \\).",
                "Pista 2: Deriva nuevamente para hallar \\( f''(x) \\).",
                "Pista 3: Evalúa \\( x = 2 \\) en el polinomio resultante."
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Calculamos la primera derivada:<br>\\[ f'(x) = 4x^3 - 6x^2 + 5 \\]<br>2. Calculamos la segunda derivada:<br>\\[ f''(x) = 12x^2 - 12x \\]<br>3. Evaluamos en \\( x = 2 \\):<br>\\[ f''(2) = 12(2)^2 - 12(2) \\]<br>\\[ f''(2) = 12(4) - 24 = 48 - 24 = 24 \\]"
        },
        {
            topic: "Tercera Derivada (Trigonométrica)",
            text: "Encuentra el valor exacto de \\( f'''(0) \\) (la tercera derivada evaluada en cero) para \\( f(x) = \\cos(2x) \\).",
            answers: ["0"],
            hints: [
                "Pista 1: Primera derivada: usa la regla de la cadena \\( -2\\sin(2x) \\).",
                "Pista 2: Segunda derivada: deriva lo anterior \\( -4\\cos(2x) \\).",
                "Pista 3: Tercera derivada: deriva nuevamente. Evalúa en 0. ¿Cuánto vale el seno de cero?"
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Primera derivada:<br>\\[ f'(x) = -2\\sin(2x) \\]<br>2. Segunda derivada:<br>\\[ f''(x) = -2[2\\cos(2x)] = -4\\cos(2x) \\]<br>3. Tercera derivada:<br>\\[ f'''(x) = -4[-2\\sin(2x)] = 8\\sin(2x) \\]<br>4. Evaluamos en \\( x = 0 \\):<br>\\[ f'''(0) = 8\\sin(2(0)) = 8\\sin(0) = 8(0) = 0 \\]"
        },
        {
            topic: "Segunda Derivada (Exponencial)",
            text: "Halla el valor de \\( f''(0) \\) para la función \\( f(x) = e^{-x} \\).",
            answers: ["1"],
            hints: [
                "Pista 1: Primera derivada: \\( -e^{-x} \\).",
                "Pista 2: Segunda derivada: multiplica por otro -1, obteniendo de nuevo \\( e^{-x} \\).",
                "Pista 3: Evalúa \\( e^0 \\)."
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Calculamos \\( f'(x) \\):<br>\\[ f'(x) = e^{-x} \\cdot (-1) = -e^{-x} \\]<br>2. Calculamos \\( f''(x) \\) derivando el resultado:<br>\\[ f''(x) = - (e^{-x} \\cdot (-1)) = e^{-x} \\]<br>3. Evaluamos en \\( x = 0 \\):<br>\\[ f''(0) = e^0 = 1 \\]"
        },

            solution: "<strong>Procedimiento:</strong><br>1. Hallamos \\( y' \\):<br>\\[ 2x + 2yy' = 0 \\implies y' = -\\frac{x}{y} \\]<br>2. Derivamos \\( y' \\) respecto a \\( x \\) con regla del cociente:<br>\\[ y'' = \\frac{d}{dx} \\left( -\\frac{x}{y} \\right) = - \\left( \\frac{1 \\cdot y - x \\cdot y'}{y^2} \\right) \\]<br>3. Sustituimos \\( y' = -x/y \\) en esta expresión:<br>\\[ y'' = - \\frac{y - x(-x/y)}{y^2} = - \\frac{y + \\frac{x^2}{y}}{y^2} \\]<br>4. Sumamos las fracciones en el numerador:<br>\\[ y'' = - \\frac{\\frac{y^2 + x^2}{y}}{y^2} = - \\frac{x^2 + y^2}{y^3} \\]<br>5. Por la ecuación original sabemos que \\( x^2 + y^2 = 25 \\):<br>\\[ y'' = -\\frac{25}{y^3} \\]<br>6. Evaluamos para la ordenada del punto \\( y = 4 \\):<br>\\[ y'' = -\\frac{25}{4^3} = -\\frac{25}{64} \\]"
        },

        // --- DERIVADAS DE ORDEN SUPERIOR (PATRONES) ---
        {
            topic: "Derivada Enésima (Patrón)",
            text: "Encuentra el valor numérico de la cuarta derivada \\( f^{(4)}(\\pi/2) \\) para la función \\( f(x) = \\sin(x) \\).",
            answers: ["1"],
            hints: [
                "Pista 1: Deriva cíclicamente. La derivada de \\( \\sin \\) es \\( \\cos \\).",
                "Pista 2: Segunda es \\( -\\sin \\). Tercera es \\( -\\cos \\).",
                "Pista 3: Cuarta derivada vuelve a ser \\( \\sin(x) \\). Evalúa en 90 grados (\\( \\pi/2 \\))."
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Calculamos las derivadas sucesivas:<br>\\[ f'(x) = \\cos(x) \\]<br>\\[ f''(x) = -\\sin(x) \\]<br>\\[ f'''(x) = -\\cos(x) \\]<br>\\[ f^{(4)}(x) = \\sin(x) \\]<br>2. Observamos que el ciclo del seno se repite cada cuatro derivadas.<br>3. Evaluamos en \\( x = \\pi/2 \\):<br>\\[ f^{(4)}(\\pi/2) = \\sin(\\pi/2) = 1 \\]"
        },
        {
            topic: "Ecuaciones Diferenciales Lineales (Verificación)",
            text: "Se sabe que la función exponencial \\( y = e^{kx} \\) es solución de la ecuación diferencial de segundo orden \\( y'' - 9y = 0 \\). ¿Cuál es el <strong>mayor valor numérico</strong> que puede tomar la constante real \\( k \\)?",
            answers: ["3"],
            hints: [
                "Pista 1: Halla las derivadas de la función: \\( y' = ke^{kx} \\) y \\( y'' = k^2 e^{kx} \\).",
                "Pista 2: Sustituye \\( y'' \\) e \\( y \\) en la ecuación diferencial: \\( k^2 e^{kx} - 9e^{kx} = 0 \\).",
                "Pista 3: Saca factor común \\( e^{kx} \\). Como una exponencial nunca es cero, lo que debe ser cero es el polinomio \\( k^2 - 9 = 0 \\). Resuelve para \\( k \\)."
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Calculamos hasta la segunda derivada de \\( y = e^{kx} \\):<br>\\[ y' = k e^{kx} \\]<br>\\[ y'' = k \\cdot k e^{kx} = k^2 e^{kx} \\]<br>2. Sustituimos en la ecuación diferencial dada:\\( y'' - 9y = 0 \\):<br>\\[ k^2 e^{kx} - 9e^{kx} = 0 \\]<br>3. Factorizamos el término común:<br>\\[ e^{kx}(k^2 - 9) = 0 \\]<br>4. Como \\( e^{kx} \\neq 0 \\) para cualquier número real, la única forma de que el producto sea cero es que:<br>\\[ k^2 - 9 = 0 \\implies k^2 = 9 \\implies k = 3, \\ k = -3 \\]<br>El mayor valor posible para \\( k \\) es 3."
        },
        {
            topic: "Tercera Derivada (Logarítmica)",
            text: "Para la función \\( f(x) = \\ln(2x) \\), calcula el valor exacto de la tercera derivada evaluada en \\( x = 1 \\), es decir, \\( f'''(1) \\).",
            answers: ["2"],
            hints: [
                "Pista 1: Por propiedades, \\( \\ln(2x) = \\ln(2) + \\ln(x) \\). La derivada de la constante es cero, así que la primera derivada es simplemente \\( 1/x \\) (o \\( x^{-1} \\)).",
                "Pista 2: Deriva \\( x^{-1} \\) para obtener la segunda derivada: \\( -x^{-2} \\).",
                "Pista 3: Deriva nuevamente para obtener la tercera derivada. Evalúa en 1."
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Para facilitar, aplicamos logaritmos: \\( f(x) = \\ln(2) + \\ln(x) \\).<br>2. Primera derivada (notando que \\( \\ln(2) \\) es una constante y su derivada es 0):<br>\\[ f'(x) = 0 + \\frac{1}{x} = x^{-1} \\]<br>3. Segunda derivada (regla de la potencia):<br>\\[ f''(x) = -1 \\cdot x^{-2} = -x^{-2} \\]<br>4. Tercera derivada:<br>\\[ f'''(x) = -1(-2)x^{-3} = 2x^{-3} = \\frac{2}{x^3} \\]<br>5. Evaluamos en \\( x = 1 \\):<br>\\[ f'''(1) = \\frac{2}{1^3} = 2 \\]"
        },

        // --- TASAS RELACIONADAS AVANZADAS ---
        {
            topic: "Tasas Relacionadas (Cono - Depósito de agua)",
            text: "Un depósito de agua tiene forma de cono invertido. Se sabe que su radio base siempre es igual a su altura (\\( r = h \\)). Si el volumen aumenta a razón de \\( 2 \\text{ m}^3/\\text{min} \\), ¿a qué velocidad (en \\( \\text{m/min} \\)) sube el nivel del agua cuando la altura es de \\( 2 \\text{ m} \\)? <br><small><em>(Usa la palabra 'pi'. La fórmula del cono es \\( V = \\frac{1}{3}\\pi r^2 h \\). Ingresa tu respuesta como fracción simplificada)</em></small>",
            answers: ["1/(2pi)"],
            hints: [
                "Pista 1: Dado que \\( r = h \\), sustituye la 'r' en la fórmula del volumen: \\( V = \\frac{1}{3}\\pi h^3 \\).",
                "Pista 2: Deriva respecto al tiempo: \\( dV/dt = \\frac{1}{3}\\pi (3h^2) \\cdot dh/dt = \\pi h^2 \\cdot dh/dt \\).",
                "Pista 3: Sustituye \\( dV/dt = 2 \\) y \\( h = 2 \\). Despeja \\( dh/dt \\)."
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Sustituimos la condición geométrica \\( r = h \\) en la fórmula de volumen para unificar variables:<br>\\[ V = \\frac{1}{3}\\pi (h)^2 h = \\frac{1}{3}\\pi h^3 \\]<br>2. Derivamos implícitamente con respecto al tiempo \\( t \\):<br>\\[ \\frac{dV}{dt} = \\frac{1}{3}\\pi \\cdot 3h^2 \\frac{dh}{dt} = \\pi h^2 \\frac{dh}{dt} \\]<br>3. Sustituimos los datos conocidos (\\( dV/dt = 2 \\) y \\( h = 2 \\)):<br>\\[ 2 = \\pi (2)^2 \\frac{dh}{dt} \\]<br>\\[ 2 = 4\\pi \\frac{dh}{dt} \\]<br>4. Despejamos la tasa de subida \\( dh/dt \\):<br>\\[ \\frac{dh}{dt} = \\frac{2}{4\\pi} = \\frac{1}{2\\pi} \\]"
        },
        {
            topic: "Tasas Relacionadas (Sombra Proyectada)",
            text: "Un hombre de 2 metros de altura camina alejándose de un farol de 6 metros de altura a una velocidad constante de \\( 2 \\text{ m/s} \\). ¿A qué velocidad (en \\( \\text{m/s} \\)) crece la longitud de su sombra?",
            answers: ["1"],
            hints: [
                "Pista 1: Modela con triángulos semejantes. Sea \\( x \\) la distancia del farol al hombre y \\( s \\) la longitud de la sombra.",
                "Pista 2: Proporción de triángulos: \\( \\frac{s}{2} = \\frac{x+s}{6} \\).",
                "Pista 3: Despeja \\( s \\) en términos de \\( x \\). Obtendrás \\( s = x/2 \\). Deriva respecto a \\( t \\) y usa que \\( dx/dt = 2 \\)."
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Por semejanza del triángulo grande (farol y distancia total) y el triángulo pequeño (hombre y sombra):<br>\\[ \\frac{\\text{sombra}}{\\text{altura hombre}} = \\frac{\\text{sombra} + \\text{distancia farol}}{\\text{altura farol}} \\]<br>\\[ \\frac{s}{2} = \\frac{x + s}{6} \\]<br>2. Despejamos \\( s \\) (la longitud de la sombra):<br>\\[ 6s = 2(x + s) = 2x + 2s \\]<br>\\[ 4s = 2x \\implies s = \\frac{2x}{4} = \\frac{1}{2}x \\]<br>3. Derivamos respecto al tiempo \\( t \\):<br>\\[ \\frac{ds}{dt} = \\frac{1}{2} \\frac{dx}{dt} \\]<br>4. Sustituimos la velocidad del hombre (\\( dx/dt = 2 \\)):<br>\\[ \\frac{ds}{dt} = \\frac{1}{2}(2) = 1 \\]"
        },
        {
            topic: "Tasas Relacionadas (Vehículos en Intersección)",
            text: "El vehículo A viaja hacia el norte a 30 km/h y el vehículo B viaja hacia el este a 40 km/h. Ambos parten del mismo punto de intersección al mismo tiempo. ¿A qué tasa (en km/h) se separan los vehículos exactamente a la hora de haber partido?",
            answers: ["50"],
            hints: [
                "Pista 1: Sus trayectorias forman un triángulo rectángulo. Aplica Pitágoras: \\( z^2 = x^2 + y^2 \\), donde \\( z \\) es la distancia entre ellos.",
                "Pista 2: A la hora de viaje, el vehículo A (y) recorrió 30 km y el B (x) recorrió 40 km. Su distancia \\( z \\) es 50 km (triángulo 3-4-5).",
                "Pista 3: Deriva: \\( 2z \\cdot dz/dt = 2x \\cdot dx/dt + 2y \\cdot dy/dt \\). Cancela el 2 en toda la ecuación y sustituye todos los valores."
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Ecuación que los relaciona: \\( x^2 + y^2 = z^2 \\).<br>2. Derivamos respecto a \\( t \\) y dividimos todo por 2:<br>\\[ x \\frac{dx}{dt} + y \\frac{dy}{dt} = z \\frac{dz}{dt} \\]<br>3. Al cabo de 1 hora, las distancias son \\( x = 40 \\) y \\( y = 30 \\). La hipotenusa es:<br>\\[ z = \\sqrt{40^2 + 30^2} = \\sqrt{1600 + 900} = \\sqrt{2500} = 50 \\]<br>4. Sustituimos distancias y velocidades (\\( dx/dt = 40 \\), \\( dy/dt = 30 \\)):<br>\\[ 40(40) + 30(30) = 50 \\frac{dz}{dt} \\]<br>\\[ 1600 + 900 = 50 \\frac{dz}{dt} \\]<br>\\[ 2500 = 50 \\frac{dz}{dt} \\implies \\frac{dz}{dt} = \\frac{2500}{50} = 50 \\]"
        },
        {
            topic: "Tasas Relacionadas (Ángulo de Elevación)",
            text: "Una cámara en el suelo se encuentra a 300 metros de la plataforma de lanzamiento de un cohete. El cohete asciende verticalmente a una velocidad constante de 100 m/s. ¿A qué tasa (en rad/s) está cambiando el ángulo de elevación de la cámara cuando el cohete está exactamente a 400 metros de altura? <br><small><em>(Ingresa fracción simplificada o decimal)</em></small>",
            answers: ["3/25", "0.12"],
            hints: [
                "Pista 1: Modela con trigonometría: \\( \\tan(\\theta) = y / 300 \\), donde \\( y \\) es la altura.",
                "Pista 2: Deriva respecto al tiempo: \\( \\sec^2(\\theta) \\cdot d\\theta/dt = (1/300) \\cdot dy/dt \\).",
                "Pista 3: Halla \\( \\sec(\\theta) \\). En el instante dado, forma un triángulo de base 300, altura 400 (hipotenusa 500). El coseno es 300/500 = 3/5, así que su recíproco \\( \\sec(\\theta) = 5/3 \\). Sustituye y despeja."
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Ecuación geométrica: \\( \\tan(\\theta) = \\frac{y}{300} \\).<br>2. Derivamos implícitamente respecto al tiempo:<br>\\[ \\sec^2(\\theta) \\frac{d\\theta}{dt} = \\frac{1}{300} \\frac{dy}{dt} \\]<br>3. En el instante donde la altura \\( y = 400 \\), la hipotenusa del triángulo (distancia de la cámara al cohete) es \\( \\sqrt{300^2 + 400^2} = 500 \\).<br>4. Calculamos \\( \\sec(\\theta) \\). Sabiendo que \\( \\cos(\\theta) = \\frac{\\text{Adyacente}}{\\text{Hipotenusa}} = \\frac{300}{500} = \\frac{3}{5} \\), su inverso secante es \\( \\frac{5}{3} \\).<br>5. Sustituimos en la ecuación diferencial, sabiendo que \\( dy/dt = 100 \\):<br>\\[ \\left(\\frac{5}{3}\\right)^2 \\frac{d\\theta}{dt} = \\frac{1}{300} (100) \\]<br>\\[ \\frac{25}{9} \\frac{d\\theta}{dt} = \\frac{1}{3} \\]<br>6. Despejamos:<br>\\[ \\frac{d\\theta}{dt} = \\frac{1}{3} \\cdot \\frac{9}{25} = \\frac{3}{25} = 0.12 \\text{ rad/s} \\]"
        },
        {
            topic: "Diferenciales y Aproximación Lineal",
            text: "El área de un triángulo está dada por \\( A = \\frac{1}{2}bh \\). Si la base \\( b \\) está aumentando a razón de 1 cm/s, y la altura \\( h \\) está disminuyendo a razón de -0.5 cm/s. ¿Cuál es la tasa de cambio del Área (en \\( \\text{cm}^2/\\text{s} \\)) en el instante exacto en que \\( b = 10 \\text{ cm} \\) y \\( h = 5 \\text{ cm} \\)?",
            answers: ["0"],
            hints: [
                "Pista 1: Es una razón de cambio con múltiples variables que varían en el tiempo. Deriva el área aplicando la regla del producto.",
                "Pista 2: \\( dA/dt = \\frac{1}{2} \\left( b \\cdot \\frac{dh}{dt} + h \\cdot \\frac{db}{dt} \\right) \\).",
                "Pista 3: Sustituye los valores en ese instante: \\( b=10, h=5, db/dt=1, dh/dt=-0.5 \\). Cuidado con los signos al multiplicar."
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Tomamos la fórmula del área y aplicamos la regla del producto para derivar respecto al tiempo \\( t \\):<br>\\[ A = \\frac{1}{2}bh \\implies \\frac{dA}{dt} = \\frac{1}{2} \\left( b \\frac{dh}{dt} + h \\frac{db}{dt} \\right) \\]<br>2. Sustituimos los valores y tasas dadas: \\( b=10 \\), \\( dh/dt = -0.5 \\), \\( h=5 \\), \\( db/dt = 1 \\).<br>\\[ \\frac{dA}{dt} = \\frac{1}{2} \\left( 10(-0.5) + 5(1) \\right) \\]<br>3. Resolvemos las operaciones internas:<br>\\[ \\frac{dA}{dt} = \\frac{1}{2} \\left( -5 + 5 \\right) = \\frac{1}{2}(0) = 0 \\]<br>En ese instante preciso, el área no crece ni decrece (su tasa instantánea es 0)."
        }
    ];

    let currentQIndex = 0;
    let hintIndex = 0;

    function initApp() {
        currentQIndex = 0;
        displayQuestion();
    }

    function displayQuestion() {
        const q = questions[currentQIndex];
        document.getElementById('topic-badge').innerText = q.topic;
        document.getElementById('question-text').innerHTML = q.text;
        
        document.getElementById('student-answer').value = '';
        document.getElementById('feedback-area').style.display = 'none';
        document.getElementById('hint-area').style.display = 'none';
        document.getElementById('solution-area').style.display = 'none';
        hintIndex = 0;
        
        if (window.MathJax) {
            MathJax.typesetPromise();
        }
    }

    function checkAnswer() {
        const studentAnsRaw = document.getElementById('student-answer').value;
        const studentAnsClean = studentAnsRaw.toLowerCase().replace(/\s/g, '');
        const q = questions[currentQIndex];
        const feedback = document.getElementById('feedback-area');
        
        if(studentAnsClean === '') {
            feedback.innerHTML = "Por favor, ingresa una respuesta antes de comprobar.";
            feedback.className = "math-feedback feedback-incorrect";
            feedback.style.display = 'block';
            return;
        }

        let isCorrect = false;
        for(let i=0; i < q.answers.length; i++) {
            if(studentAnsClean === q.answers[i]) {
                isCorrect = true;
                break;
            }
        }

        if (isCorrect) {
            feedback.innerHTML = "<strong>¡Excelente cálculo!</strong> Tu respuesta es completamente correcta.";
            feedback.className = "math-feedback feedback-correct";
        } else {
            feedback.innerHTML = `<strong>Respuesta incorrecta.</strong> Te sugerimos repasar cuidadosamente el tópico: <em>${q.topic}</em>, prestando especial atención a las reglas de derivación. Utiliza el botón de pistas si necesitas ayuda.`;
            feedback.className = "math-feedback feedback-incorrect";
        }
        feedback.style.display = 'block';
    }

    function showHint() {
        const q = questions[currentQIndex];
        const hintBox = document.getElementById('hint-area');
        
        if (hintIndex < q.hints.length) {
            let currentHintsHTML = "";
            for(let i=0; i<=hintIndex; i++){
                currentHintsHTML += "<p>" + q.hints[i] + "</p>";
            }
            hintBox.innerHTML = currentHintsHTML;
            hintBox.style.display = 'block';
            hintIndex++;
            
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        } else {
            hintBox.innerHTML += "<p><em>No hay más pistas. Consulta la solución paso a paso para identificar si hubo algún error en el álgebra o en las reglas de derivación.</em></p>";
        }
    }

    function showSolution() {
        const solutionBox = document.getElementById('solution-area');
        const q = questions[currentQIndex];
        solutionBox.innerHTML = q.solution;
        solutionBox.style.display = 'block';
        
        if (window.MathJax) {
            MathJax.typesetPromise();
        }
    }

    function loadNextQuestion() {
        currentQIndex++;
        if (currentQIndex >= questions.length) {
            currentQIndex = 0; 
        }
        displayQuestion();
    }

    setTimeout(initApp, 500);
</script>
