<script>
    // Base de datos de ejercicios de la Unidad II (Sin alucinaciones)
    // Todos los ejercicios (Lote 3 y Lote 4) unificados en un solo array
    const questions = [
        // --- EVALUACIÓN INTUITIVA Y TEOREMAS ---
        {
            topic: "Evaluación Directa",
            text: "Evaluando mediante los teoremas de límites, calcula el valor exacto de: <br><br> \\( \\lim_{x \\to -2} (3x^2 - 4x + 1) \\)",
            answers: ["21"],
            hints: [
                "Pista 1: Las funciones polinómicas son continuas en todos los números reales.",
                "Pista 2: Por el teorema de sustitución directa para polinomios, simplemente evalúa la función en \\( x = -2 \\).",
                "Pista 3: Ten cuidado con los signos al elevar al cuadrado: \\( (-2)^2 = 4 \\)."
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Al ser un polinomio, aplicamos sustitución directa:<br>\\[ \\lim_{x \\to -2} (3x^2 - 4x + 1) = 3(-2)^2 - 4(-2) + 1 \\]<br>2. Resolvemos las potencias y multiplicaciones:<br>\\[ = 3(4) + 8 + 1 \\]<br>\\[ = 12 + 8 + 1 = 21 \\]"
        },
        {
            topic: "Límites Laterales (Función a Trozos)",
            text: "Dada la función definida a trozos: <br> \\( f(x) = \\begin{cases} x^2, & \\text{si } x < 1 \\\\ 3, & \\text{si } x = 1 \\\\ 2x - 1, & \\text{si } x > 1 \\end{cases} \\) <br> Encuentra el valor de \\( \\lim_{x \\to 1} f(x) \\). <br><small><em>(Si el límite no existe, escribe 'no existe' sin comillas)</em></small>",
            answers: ["1"],
            hints: [
                "Pista 1: El límite existe si y solo si los límites laterales son iguales. El valor en \\( x = 1 \\) (que es 3) NO importa para el límite.",
                "Pista 2: Calcula el límite por la izquierda (\\( x \\to 1^- \\)) usando \\( x^2 \\).",
                "Pista 3: Calcula el límite por la derecha (\\( x \\to 1^+ \\)) usando \\( 2x - 1 \\). Compara ambos resultados."
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Límite lateral izquierdo (valores menores que 1):<br>\\[ \\lim_{x \\to 1^-} f(x) = \\lim_{x \\to 1^-} (x^2) = (1)^2 = 1 \\]<br>2. Límite lateral derecho (valores mayores que 1):<br>\\[ \\lim_{x \\to 1^+} f(x) = \\lim_{x \\to 1^+} (2x - 1) = 2(1) - 1 = 1 \\]<br>3. Como los límites laterales existen y son iguales (\\( 1 = 1 \\)), el límite general de la función cuando \\( x \\to 1 \\) existe y es 1, independientemente de que \\( f(1) = 3 \\)."
        },
        {
            topic: "Propiedades de los Límites",
            text: "Si sabemos que \\( \\lim_{x \\to 5} f(x) = 4 \\) y \\( \\lim_{x \\to 5} g(x) = -2 \\), calcula el valor exacto de: <br><br> \\( \\lim_{x \\to 5} [f(x) - 3g(x)]^2 \\)",
            answers: ["100"],
            hints: [
                "Pista 1: Usa las leyes de los límites para introducir el límite dentro del corchete y distribuirlo.",
                "Pista 2: Se convierte en \\( [\\lim f(x) - 3\\lim g(x)]^2 \\).",
                "Pista 3: Sustituye los valores dados: \\( [4 - 3(-2)]^2 \\) y resuelve la aritmética."
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Aplicamos la ley de la potencia y la linealidad de los límites:<br>\\[ \\left[ \\lim_{x \\to 5} f(x) - 3 \\cdot \\lim_{x \\to 5} g(x) \\right]^2 \\]<br>2. Sustituimos los valores numéricos dados en la hipótesis:<br>\\[ [4 - 3(-2)]^2 \\]<br>3. Resolvemos el interior del corchete respetando la jerarquía:<br>\\[ [4 + 6]^2 = [10]^2 = 100 \\]"
        },
        {
            topic: "Teorema de Estricción (Sándwich)",
            text: "Para toda \\( x \\) en un intervalo alrededor de 2, se cumple la desigualdad: <br> \\( 3x - 1 \\leq f(x) \\leq x^2 - x + 3 \\). <br> Determina el valor exacto de \\( \\lim_{x \\to 2} f(x) \\).",
            answers: ["5"],
            hints: [
                "Pista 1: El Teorema del Sándwich o Encaje establece que si una función está atrapada entre otras dos y ambas tienen el mismo límite en un punto, la función atrapada también lo tendrá.",
                "Pista 2: Evalúa el límite de la función de la izquierda cuando \\( x \\to 2 \\).",
                "Pista 3: Evalúa el límite de la función de la derecha cuando \\( x \\to 2 \\). ¿Dan el mismo resultado?"
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Calculamos el límite de la cota inferior:<br>\\[ \\lim_{x \\to 2} (3x - 1) = 3(2) - 1 = 6 - 1 = 5 \\]<br>2. Calculamos el límite de la cota superior:<br>\\[ \\lim_{x \\to 2} (x^2 - x + 3) = (2)^2 - 2 + 3 = 4 - 2 + 3 = 5 \\]<br>3. Ya que \\( 5 \\leq \\lim_{x \\to 2} f(x) \\leq 5 \\), por el Teorema de Estricción (Sándwich), concluimos que:<br>\\[ \\lim_{x \\to 2} f(x) = 5 \\]"
        },

        // --- DEFINICIÓN FORMAL ÉPSILON-DELTA ---
        {
            topic: "Definición Formal de Límite (Épsilon-Delta)",
            text: "Se afirma que \\( \\lim_{x \\to 3} (2x - 1) = 5 \\). Dado un \\( \\epsilon = 0.1 \\), determina el mayor valor posible para \\( \\delta > 0 \\) que satisfaga la definición formal.",
            answers: ["0.05", "1/20"],
            hints: [
                "Pista 1: La definición exige que si \\( 0 < |x - 3| < \\delta \\), entonces \\( |f(x) - L| < \\epsilon \\).",
                "Pista 2: Sustituye las funciones: \\( |(2x - 1) - 5| < 0.1 \\).",
                "Pista 3: Simplifica el valor absoluto para que aparezca \\( |x - 3| \\). Saca factor común 2 y pásalo dividiendo."
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Partimos de \\( |f(x) - L| < \\epsilon \\):<br>\\[ |(2x - 1) - 5| < 0.1 \\]<br>2. Simplificamos el interior del valor absoluto:<br>\\[ |2x - 6| < 0.1 \\]<br>3. Factorizamos el 2 (por ser positivo sale igual del valor absoluto):<br>\\[ 2|x - 3| < 0.1 \\]<br>4. Despejamos \\( |x - 3| \\) para igualar a \\( \\delta \\):<br>\\[ |x - 3| < \\frac{0.1}{2} = 0.05 \\]<br>El mayor valor posible para \\( \\delta \\) es 0.05."
        },
        {
            topic: "Análisis Épsilon-Delta",
            text: "Para demostrar formalmente que \\( \\lim_{x \\to -2} (-3x + 4) = 10 \\), se encuentra una relación del tipo \\( \\delta = k \\cdot \\epsilon \\). ¿Cuál es el valor exacto de la constante <strong>\\( k \\)</strong>? <br><small><em>(Ingresa una fracción simplificada)</em></small>",
            answers: ["1/3"],
            hints: [
                "Pista 1: Inicia con \\( |(-3x + 4) - 10| < \\epsilon \\).",
                "Pista 2: Simplifica obteniendo \\( |-3x - 6| < \\epsilon \\).",
                "Pista 3: Saca factor común -3. Recuerda que al salir del valor absoluto, sale como positivo: \\( |-3| \\cdot |x + 2| \\). Luego despeja \\( |x - (-2)| \\)."
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Escribimos la condición \\( |f(x) - L| < \\epsilon \\):<br>\\[ |-3x + 4 - 10| < \\epsilon \\]<br>\\[ |-3x - 6| < \\epsilon \\]<br>2. Factorizamos -3 dentro del valor absoluto:<br>\\[ |-3(x + 2)| < \\epsilon \\]<br>3. Por propiedades, \\( |a \\cdot b| = |a| \\cdot |b| \\):<br>\\[ |-3| \\cdot |x + 2| < \\epsilon \\]<br>\\[ 3|x + 2| < \\epsilon \\]<br>4. Despejamos la forma \\( |x - c| \\) que corresponde a \\( \\delta \\):<br>\\[ |x + 2| < \\frac{\\epsilon}{3} \\]<br>Por lo tanto, elegimos \\( \\delta = \\frac{1}{3}\\epsilon \\), haciendo \\( k = 1/3 \\)."
        },

        // --- LÍMITES INDETERMINADOS 0/0 (FACTORIZACIÓN) ---
        {
            topic: "Indeterminación 0/0 (Diferencia de Cuadrados)",
            text: "Rompe la indeterminación y calcula: <br><br> \\( \\lim_{x \\to 4} \\frac{x^2 - 16}{x - 4} \\)",
            answers: ["8"],
            hints: [
                "Pista 1: Al evaluar en x=4 obtienes 0/0. El numerador es una diferencia de cuadrados.",
                "Pista 2: Factoriza el numerador sabiendo que \\( a^2 - b^2 = (a-b)(a+b) \\).",
                "Pista 3: Cancela el término \\( (x - 4) \\) y evalúa el límite resultante."
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Evaluación directa da 0/0.<br>2. Factorizamos el numerador:<br>\\[ \\lim_{x \\to 4} \\frac{(x - 4)(x + 4)}{x - 4} \\]<br>3. Como \\( x \\to 4 \\) pero \\( x \\neq 4 \\), podemos cancelar el término conflictivo:<br>\\[ \\lim_{x \\to 4} (x + 4) \\]<br>4. Evaluamos el nuevo límite:<br>\\[ 4 + 4 = 8 \\]"
        },
        {
            topic: "Indeterminación 0/0 (Trinomios Cuadráticos)",
            text: "Calcula el valor exacto de: <br><br> \\( \\lim_{x \\to 3} \\frac{x^2 - x - 6}{x^2 - 9} \\) <br><small><em>(Ingresa fracción simplificada. Ej: 2/5)</em></small>",
            answers: ["5/6"],
            hints: [
                "Pista 1: Factoriza el numerador buscando números que multipliquen -6 y sumen -1.",
                "Pista 2: Factoriza el denominador usando diferencia de cuadrados.",
                "Pista 3: El factor común problemático es \\( (x - 3) \\). Cancélalo y evalúa el límite en x=3."
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Al evaluar obtenemos 0/0.<br>2. Factorizamos el numerador: \\( x^2 - x - 6 = (x - 3)(x + 2) \\).<br>3. Factorizamos el denominador: \\( x^2 - 9 = (x - 3)(x + 3) \\).<br>4. Sustituimos en el límite y cancelamos:<br>\\[ \\lim_{x \\to 3} \\frac{(x - 3)(x + 2)}{(x - 3)(x + 3)} = \\lim_{x \\to 3} \\frac{x + 2}{x + 3} \\]<br>5. Evaluamos el límite remanente:<br>\\[ \\frac{3 + 2}{3 + 3} = \\frac{5}{6} \\]"
        },
        {
            topic: "Indeterminación 0/0 (Suma/Diferencia de Cubos)",
            text: "Calcula numéricamente: <br><br> \\( \\lim_{x \\to 2} \\frac{x^3 - 8}{x - 2} \\)",
            answers: ["12"],
            hints: [
                "Pista 1: El numerador es una diferencia de cubos perfectos (\\( x^3 - 2^3 \\)).",
                "Pista 2: La fórmula de factorización es \\( a^3 - b^3 = (a - b)(a^2 + ab + b^2) \\).",
                "Pista 3: Al factorizar, cancelarás el denominador. Luego, evalúa la expresión cuadrática restante en x=2."
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Evaluación directa da 0/0.<br>2. Factorizamos el numerador como diferencia de cubos:<br>\\[ x^3 - 8 = (x - 2)(x^2 + 2x + 4) \\]<br>3. Sustituimos en el límite:<br>\\[ \\lim_{x \\to 2} \\frac{(x - 2)(x^2 + 2x + 4)}{x - 2} \\]<br>4. Cancelamos y evaluamos:<br>\\[ \\lim_{x \\to 2} (x^2 + 2x + 4) = (2)^2 + 2(2) + 4 = 4 + 4 + 4 = 12 \\]"
        },

        // --- LÍMITES INDETERMINADOS 0/0 (RACIONALIZACIÓN) ---
        {
            topic: "Indeterminación 0/0 (Radical Simple)",
            text: "Halla el valor exacto de: <br><br> \\( \\lim_{x \\to 9} \\frac{\\sqrt{x} - 3}{x - 9} \\) <br><small><em>(Ingresa fracción simplificada)</em></small>",
            answers: ["1/6"],
            hints: [
                "Pista 1: Multiplica numerador y denominador por el conjugado del numerador, que es \\( (\\sqrt{x} + 3) \\).",
                "Pista 2: En el numerador, te quedará un producto notable: \\( (\\sqrt{x})^2 - (3)^2 = x - 9 \\).",
                "Pista 3: Cancela el término \\( x - 9 \\) del numerador y del denominador. ¡Recuerda que queda un 1 en el numerador!"
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Como da 0/0, racionalizamos multiplicando por el conjugado:<br>\\[ \\lim_{x \\to 9} \\frac{(\\sqrt{x} - 3)(\\sqrt{x} + 3)}{(x - 9)(\\sqrt{x} + 3)} \\]<br>2. Aplicamos producto notable en el numerador:<br>\\[ \\lim_{x \\to 9} \\frac{x - 9}{(x - 9)(\\sqrt{x} + 3)} \\]<br>3. Cancelamos el término común:<br>\\[ \\lim_{x \\to 9} \\frac{1}{\\sqrt{x} + 3} \\]<br>4. Evaluamos:<br>\\[ \\frac{1}{\\sqrt{9} + 3} = \\frac{1}{3 + 3} = \\frac{1}{6} \\]"
        },
        {
            topic: "Indeterminación 0/0 (Radical Compuesto)",
            text: "Calcula el valor exacto de: <br><br> \\( \\lim_{x \\to 0} \\frac{\\sqrt{x+4} - 2}{x} \\)",
            answers: ["1/4", "0.25"],
            hints: [
                "Pista 1: Racionaliza multiplicando arriba y abajo por \\( (\\sqrt{x+4} + 2) \\).",
                "Pista 2: Al multiplicar los conjugados en el numerador obtendrás \\( (x + 4) - 4 \\).",
                "Pista 3: El numerador se reduce a \\( x \\). Cancélala con la \\( x \\) del denominador y evalúa en 0."
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Al evaluar da 0/0. Multiplicamos por la conjugada:<br>\\[ \\lim_{x \\to 0} \\frac{(\\sqrt{x+4} - 2)(\\sqrt{x+4} + 2)}{x(\\sqrt{x+4} + 2)} \\]<br>2. Resolvemos el numerador:<br>\\[ \\lim_{x \\to 0} \\frac{(x + 4) - 4}{x(\\sqrt{x+4} + 2)} = \\lim_{x \\to 0} \\frac{x}{x(\\sqrt{x+4} + 2)} \\]<br>3. Cancelamos la \\( x \\):<br>\\[ \\lim_{x \\to 0} \\frac{1}{\\sqrt{x+4} + 2} \\]<br>4. Evaluamos para \\( x = 0 \\):<br>\\[ \\frac{1}{\\sqrt{4} + 2} = \\frac{1}{2 + 2} = \\frac{1}{4} = 0.25 \\]"
        },
        {
            topic: "Indeterminación 0/0 (Radical con coeficientes)",
            text: "Encuentra el valor exacto de: <br><br> \\( \\lim_{x \\to 4} \\frac{\\sqrt{2x+1} - 3}{x - 4} \\) <br><small><em>(Ingresa fracción simplificada)</em></small>",
            answers: ["1/3"],
            hints: [
                "Pista 1: Multiplica por el conjugado: \\( \\sqrt{2x+1} + 3 \\).",
                "Pista 2: En el numerador te quedará \\( (2x + 1) - 9 \\), que se simplifica a \\( 2x - 8 \\).",
                "Pista 3: Factoriza el numerador sacando factor común 2, obteniendo \\( 2(x - 4) \\). Cancela y evalúa."
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Racionalizamos multiplicando por el conjugado:<br>\\[ \\lim_{x \\to 4} \\frac{(\\sqrt{2x+1} - 3)(\\sqrt{2x+1} + 3)}{(x - 4)(\\sqrt{2x+1} + 3)} \\]<br>2. Aplicamos diferencia de cuadrados en el numerador:<br>\\[ \\lim_{x \\to 4} \\frac{2x + 1 - 9}{(x - 4)(\\sqrt{2x+1} + 3)} \\]<br>\\[ \\lim_{x \\to 4} \\frac{2x - 8}{(x - 4)(\\sqrt{2x+1} + 3)} \\]<br>3. Factorizamos el numerador y cancelamos:<br>\\[ \\lim_{x \\to 4} \\frac{2(x - 4)}{(x - 4)(\\sqrt{2x+1} + 3)} = \\lim_{x \\to 4} \\frac{2}{\\sqrt{2x+1} + 3} \\]<br>4. Evaluamos en \\( x = 4 \\):<br>\\[ \\frac{2}{\\sqrt{9} + 3} = \\frac{2}{3 + 3} = \\frac{2}{6} = \\frac{1}{3} \\]"
        },

        // --- LÍMITES ESPECIALES: FRACCIONES Y VALOR ABSOLUTO ---
        {
            topic: "Límites con Fracciones Complejas",
            text: "Resuelve de forma analítica: <br><br> \\( \\lim_{x \\to 0} \\frac{\\frac{1}{x+2} - \\frac{1}{2}}{x} \\)",
            answers: ["-1/4", "-0.25"],
            hints: [
                "Pista 1: Realiza la resta de fracciones en el numerador buscando mínimo común múltiplo.",
                "Pista 2: El numerador será \\( \\frac{2 - (x+2)}{2(x+2)} \\). Ten cuidado con el signo menos, altera a toda la expresión del paréntesis.",
                "Pista 3: Te quedará \\( -x \\) arriba. Al aplicar la \"doble C\" o extremos y medios, podrás cancelar la \\( x \\)."
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Restamos las fracciones del numerador:<br>\\[ \\lim_{x \\to 0} \\frac{ \\frac{2 - (x+2)}{2(x+2)} }{x} \\]<br>\\[ \\lim_{x \\to 0} \\frac{ \\frac{2 - x - 2}{2(x+2)} }{x} \\]<br>\\[ \\lim_{x \\to 0} \\frac{ \\frac{-x}{2(x+2)} }{x} \\]<br>2. Aplicamos propiedades de división de fracciones (el \\( x \\) inferior tiene denominador 1):<br>\\[ \\lim_{x \\to 0} \\frac{-x}{x \\cdot 2(x+2)} \\]<br>3. Cancelamos la \\( x \\) (ya que \\( x \\neq 0 \\)):<br>\\[ \\lim_{x \\to 0} \\frac{-1}{2(x+2)} \\]<br>4. Evaluamos:<br>\\[ \\frac{-1}{2(0+2)} = -\\frac{1}{4} = -0.25 \\]"
        },
        {
            topic: "Límites Laterales y Valor Absoluto (Trampa de signo)",
            text: "Analiza rigurosamente y halla: <br><br> \\( \\lim_{x \\to 3^-} \\frac{|x - 3|}{x - 3} \\)",
            answers: ["-1"],
            hints: [
                "Pista 1: Estás evaluando el límite por la izquierda, es decir, para valores ligeramente MENORES que 3 (ej. 2.9, 2.99).",
                "Pista 2: Si \\( x < 3 \\), entonces la expresión \\( x - 3 \\) es un número NEGATIVO.",
                "Pista 3: Por definición de valor absoluto, si el interior es negativo, se le quitan las barras multiplicando por un signo menos: \\( -(x - 3) \\). Sustituye y cancela."
            ],
            solution: "<strong>Procedimiento:</strong><br>1. Analizamos el comportamiento del valor absoluto. Por definición:<br>\\( |x - 3| = x - 3 \\) si \\( x \\geq 3 \\)<br>\\( |x - 3| = -(x - 3) \\) si \\( x < 3 \\)<br>2. Como el límite nos exige acercarnos a 3 por la izquierda (\\( x \\to 3^- \\)), tomamos el escenario donde \\( x < 3 \\).<br>3. Reemplazamos en el límite:<br>\\[ \\lim_{x \\to 3^-} \\frac{-(x - 3)}{x - 3} \\]<br>4. Cancelamos los factores comunes:<br>\\[ \\lim_{x \\to 3^-} (-1) = -1 \\]"
        },

        // --- ASÍNTOTAS Y LÍMITES AL INFINITO ---
        {
            topic: "Asíntotas Verticales",
            text: "Dada la función racional \\( f(x) = \\frac{2x + 5}{x - 4} \\), halla el valor \\( x = k \\) donde la función presenta una asíntota vertical.",
            answers: ["4"],
            hints: [
                "Pista 1: Las asíntotas verticales ocurren en aquellos puntos que anulan el denominador pero NO el numerador (para que el límite dé infinito).",
                "Pista 2: Iguala el denominador a cero: \\( x - 4 = 0 \\).",

        },

        // --- CONTINUIDAD Y DISCONTINUIDAD ---
        {

        {

        {

            hints: [

            ],
            solution: "<strong>Procedimiento:</strong><br>1. Analizamos la tendencia del argumento exponente \\( u(x) = \\frac{1}{x} \\) por la izquierda de 0:<br>\\[ \\lim_{x \\to 0^-} \\frac{1}{x} = -\\infty \\]<br>2. Evaluamos la función exponencial completa con este comportamiento:<br>\\[ \\lim_{x \\to 0^-} e^{1/x} = e^{-\\infty} \\]<br>3. Por las propiedades de la función exponencial, \\( e^{-\\infty} \\) es equivalente a \\( \\lim_{u \\to \\infty} \\frac{1}{e^u} \\), cuyo denominador crece sin medida, haciendo que la fracción se acerque a cero.<br>\\[ \\lim_{x \\to 0^-} e^{1/x} = 0 \\]<br><em>Nota para análisis de discontinuidad: Si el límite fuera por la derecha (\\( 0^+ \\)), el resultado sería \\( +\\infty \\), creando una discontinuidad esencial (infinita) en x=0.</em>"

    let currentQIndex = 0;
    let hintIndex = 0;

    function initApp() {
        currentQIndex = 0;
        displayQuestion();
    }

    function displayQuestion() {
        const q = questions[currentQIndex];
        document.getElementById('topic-badge').innerText = q.topic;
        document.getElementById('question-text').innerHTML = q.text;
        
        // Reset de la interfaz
        document.getElementById('student-answer').value = '';
        document.getElementById('feedback-area').style.display = 'none';
        document.getElementById('hint-area').style.display = 'none';
        document.getElementById('solution-area').style.display = 'none';
        hintIndex = 0;
        
        // Renderizar las matemáticas de MathJax
        if (window.MathJax) {
            MathJax.typesetPromise();
        }
    }

    function checkAnswer() {
        const studentAnsRaw = document.getElementById('student-answer').value;
        const studentAnsClean = studentAnsRaw.toLowerCase().replace(/\s/g, '');
        const q = questions[currentQIndex];
        const feedback = document.getElementById('feedback-area');
        
        if(studentAnsClean === '') {
            feedback.innerHTML = "Por favor, ingresa una respuesta antes de comprobar.";
            feedback.className = "math-feedback feedback-incorrect";
            feedback.style.display = 'block';
            return;
        }

        let isCorrect = false;
        for(let i=0; i < q.answers.length; i++) {
            if(studentAnsClean === q.answers[i]) {
                isCorrect = true;
                break;
            }
        }

        if (isCorrect) {
            feedback.innerHTML = "<strong>¡Excelente trabajo!</strong> Tu respuesta es completamente correcta.";
            feedback.className = "math-feedback feedback-correct";
        } else {
            feedback.innerHTML = `<strong>Respuesta incorrecta.</strong> Te sugerimos repasar a fondo el tópico: <em>${q.topic}</em> en el material de estudio. Utiliza el botón de pistas si necesitas guía paso a paso.`;
            feedback.className = "math-feedback feedback-incorrect";
        }
        feedback.style.display = 'block';
    }

    function showHint() {
        const q = questions[currentQIndex];
        const hintBox = document.getElementById('hint-area');
        
        if (hintIndex < q.hints.length) {
            let currentHintsHTML = "";
            for(let i=0; i<=hintIndex; i++){
                currentHintsHTML += "<p>" + q.hints[i] + "</p>";
            }
            hintBox.innerHTML = currentHintsHTML;
            hintBox.style.display = 'block';
            hintIndex++;
            
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        } else {
            hintBox.innerHTML += "<p><em>No hay más pistas disponibles. Intenta ver la solución completa para corregir errores.</em></p>";
        }
    }

    function showSolution() {
        const solutionBox = document.getElementById('solution-area');
        const q = questions[currentQIndex];
        solutionBox.innerHTML = q.solution;
        solutionBox.style.display = 'block';
        
        if (window.MathJax) {
            MathJax.typesetPromise();
        }
    }

    function loadNextQuestion() {
        currentQIndex++;
        if (currentQIndex >= questions.length) {
            currentQIndex = 0; 
        }
        displayQuestion();
    }

    setTimeout(initApp, 500);
</script>
