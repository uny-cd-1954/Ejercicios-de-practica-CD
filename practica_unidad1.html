            solution: "<strong>Procedimiento:</strong><br>1. Llevamos ambos lados de la ecuación a la misma base fundamental (base 2):<br>\\[ (2^2)^{2x} = (2^3)^{x-1} \\]<br>2. Aplicamos la propiedad de potencia de una potencia (multiplicamos exponentes):<br>\\[ 2^{4x} = 2^{3(x-1)} \\]<br>\\[ 2^{4x} = 2^{3x - 3} \\]<br>3. Al tener bases iguales, igualamos los exponentes algebraicamente:<br>\\[ 4x = 3x - 3 \\]<br>4. Despejamos \\( x \\):<br>\\[ 4x - 3x = -3 \\implies x = -3 \\]"

        {

            solution: "<strong>Procedimiento:</strong><br>1. Realizamos el cambio de variable \\( u = e^x \\). La ecuación toma forma cuadrática:<br>\\[ u^2 - 5u + 6 = 0 \\]<br>2. Factorizamos buscando números que sumen -5 y multipliquen 6:<br>\\[ (u - 3)(u - 2) = 0 \\implies u_1 = 3, \\ u_2 = 2 \\]<br>3. Deshacemos el cambio de variable:<br>- \\( e^{x_1} = 3 \\implies x_1 = \\ln(3) \\)<br>- \\( e^{x_2} = 2 \\implies x_2 = \\ln(2) \\)<br>4. Se nos pide la suma de las soluciones reales:<br>\\[ \\ln(3) + \\ln(2) \\]<br>5. Por propiedades de los logaritmos (suma de logaritmos es logaritmo del producto):<br>\\[ \\ln(3 \\cdot 2) = \\ln(6) \\]<br>Por lo tanto, la constante \\( k \\) es 6."

        {

            hints: [

    let currentQIndex = 0;
    let hintIndex = 0;

    function initApp() {
        currentQIndex = 0;
        displayQuestion();
    }

    function displayQuestion() {
        const q = questions[currentQIndex];
        document.getElementById('topic-badge').innerText = q.topic;
        document.getElementById('question-text').innerHTML = q.text;
        
        // Reset de la interfaz
        document.getElementById('student-answer').value = '';
        document.getElementById('feedback-area').style.display = 'none';
        document.getElementById('hint-area').style.display = 'none';
        document.getElementById('solution-area').style.display = 'none';
        hintIndex = 0;
        
        // Renderizar las matemáticas de MathJax
        if (window.MathJax) {
            MathJax.typesetPromise();
        }
    }

    function checkAnswer() {
        const studentAnsRaw = document.getElementById('student-answer').value;
        // Limpiamos la respuesta: minúsculas, sin espacios
        const studentAnsClean = studentAnsRaw.toLowerCase().replace(/\s/g, '');
        const q = questions[currentQIndex];
        const feedback = document.getElementById('feedback-area');
        
        if(studentAnsClean === '') {
            feedback.innerHTML = "Por favor, ingresa una respuesta antes de comprobar.";
            feedback.className = "math-feedback feedback-incorrect";
            feedback.style.display = 'block';
            return;
        }

        let isCorrect = false;
        for(let i=0; i < q.answers.length; i++) {
            if(studentAnsClean === q.answers[i]) {
                isCorrect = true;
                break;
            }
        }

        if (isCorrect) {
            feedback.innerHTML = "<strong>¡Excelente!</strong> Tu respuesta y razonamiento matemático son correctos.";
            feedback.className = "math-feedback feedback-correct";
        } else {
            feedback.innerHTML = `<strong>Respuesta incorrecta.</strong> Te sugerimos repasar a fondo el tópico: <em>${q.topic}</em>. Recuerda verificar signos y dominios. Usa el botón de pistas si te quedas atascado.`;
            feedback.className = "math-feedback feedback-incorrect";
        }
        feedback.style.display = 'block';
    }

    function showHint() {
        const q = questions[currentQIndex];
        const hintBox = document.getElementById('hint-area');
        
        if (hintIndex < q.hints.length) {
            let currentHintsHTML = "";
            for(let i=0; i<=hintIndex; i++){
                currentHintsHTML += "<p>" + q.hints[i] + "</p>";
            }
            hintBox.innerHTML = currentHintsHTML;
            hintBox.style.display = 'block';
            hintIndex++;
            
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        } else {
            hintBox.innerHTML += "<p><em>No hay más pistas disponibles. Intenta ver la solución paso a paso para identificar el posible error analítico.</em></p>";
        }
    }

    function showSolution() {
        const solutionBox = document.getElementById('solution-area');
        const q = questions[currentQIndex];
        solutionBox.innerHTML = q.solution;
        solutionBox.style.display = 'block';
        
        if (window.MathJax) {
            MathJax.typesetPromise();
        }
    }

    function loadNextQuestion() {
        currentQIndex++;
        if (currentQIndex >= questions.length) {
            currentQIndex = 0; // Reinicia el ciclo
        }
        displayQuestion();
    }

    // Iniciar aplicación al cargar
    window.addEventListener('load', initApp);
</script>
